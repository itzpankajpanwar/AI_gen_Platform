# Deployment target is intentionally undecided (see README "Infrastructure").
# The gate below keeps this workflow inert until DEPLOY_HOST is configured,
# so nothing here assumes a cloud provider, VM type or GPU.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment target
        id: target
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No DEPLOY_HOST secret set — skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.target.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -m 600 /dev/stdin key <<< "$DEPLOY_KEY"
          ssh -i key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $DEPLOY_PATH && git pull --ff-only && docker compose up -d --build"
          rm -f key

      - name: Health check
        if: steps.target.outputs.configured == 'true'
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS "$HEALTH_URL" | grep -q '"status"'; then
              echo "Healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed."
          exit 1
